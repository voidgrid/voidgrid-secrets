# Example docker compose setup for voidgrid-secrets, plus (commented out)
# two ways for other services to get their secrets - never written to disk
# or into `docker inspect`:
#   - `voidgrid-secrets run` wraps a consumer's command (any image);
#   - `voidgrid-secrets agent` is a sidecar that keeps consumers' secrets
#     as files on a shared in-memory volume (images with *_FILE support).
#
# One-time setup before the first `docker compose up` - generate the root
# encryption key into the voidgrid-root-key volume:
#
#   docker compose -f examples/docker-compose.yml run --rm --entrypoint /usr/local/bin/voidgrid-secrets voidgrid-secrets keygen -path /run/secrets/voidgrid-root-key
#
# Losing that key makes every stored secret permanently unrecoverable, so
# back the volume up like any other secret material. See docs/deployment.md,
# docs/authentication.md and docs/runtime-injection.md for the rest.

services:
  voidgrid-secrets:
    # Pin this to a specific version tag for anything you rely on.
    image: ghcr.io/voidgrid/voidgrid-secrets:beta
    # Runs unprivileged; the image itself also defaults to this user.
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - voidgrid-data:/data
      - voidgrid-root-key:/run/secrets

  # --- Example consumer. Uncomment this block, the voidgrid-bin volume and
  # the secrets block at the bottom.
  #
  # 1. In the web UI (admin > tokens), create a token for this service and
  #    grant it "read" on each secret it needs, with the environment
  #    variable name the app expects (or leave it blank to derive one).
  # 2. Save the token (shown once) to ./example-consumer-voidgrid-token,
  #    readable by the user the consumer runs as. Never commit it.
  # 3. After `--`, restate the image's original entrypoint and command.
  #
  # voidgrid-secrets-bin:
  #   image: ghcr.io/voidgrid/voidgrid-secrets:beta
  #   entrypoint: ["cp", "/usr/local/bin/voidgrid-secrets", "/export/voidgrid-secrets"]
  #   volumes:
  #     - voidgrid-bin:/export
  #
  # example-consumer:
  #   image: your-other-service:latest
  #   depends_on:
  #     voidgrid-secrets-bin:
  #       condition: service_completed_successfully
  #   environment:
  #     VOIDGRID_URL: http://voidgrid-secrets:8443
  #   secrets:
  #     - voidgrid-token
  #   volumes:
  #     - voidgrid-bin:/opt/voidgrid:ro
  #   entrypoint: ["/opt/voidgrid/voidgrid-secrets", "run", "--"]
  #   command: ["your-real-entrypoint", "--its-args"]

  # --- Example agent consumer. Uncomment this block, the voidgrid-out
  # volume and the postgres-token secret at the bottom.
  #
  # 1. Create a token for this service and grant it "read" on its secrets,
  #    as above (e.g. db-password under the name POSTGRES_PASSWORD).
  # 2. Save the token to ./postgres-voidgrid-token, readable by UID 1000
  #    (the agent). Never commit it.
  # 3. gid=999 is the group the official postgres image runs as. For any
  #    other consumer, use its group - or pick one and add it to that
  #    consumer's group_add. Every target's GID goes in the agent's
  #    group_add.
  #
  # voidgrid-agent:
  #   image: ghcr.io/voidgrid/voidgrid-secrets:beta
  #   entrypoint: ["/usr/local/bin/voidgrid-secrets", "agent"]
  #   command:
  #     - --url=http://voidgrid-secrets:8443
  #     - --out=/out
  #     - --target=postgres=/run/secrets/postgres-token,gid=999
  #   group_add: ["999"]
  #   secrets:
  #     - postgres-token
  #   volumes:
  #     - voidgrid-out:/out
  #   healthcheck:
  #     test: ["CMD", "test", "-f", "/tmp/voidgrid-agent-ready"]
  #     interval: 5s
  #   restart: unless-stopped
  #
  # postgres:
  #   image: postgres:17
  #   depends_on:
  #     voidgrid-agent:
  #       condition: service_healthy
  #   environment:
  #     POSTGRES_PASSWORD_FILE: /run/voidgrid/POSTGRES_PASSWORD
  #   volumes:
  #     - type: volume
  #       source: voidgrid-out
  #       target: /run/voidgrid
  #       read_only: true
  #       volume:
  #         subpath: postgres

volumes:
  voidgrid-data:
  voidgrid-root-key:
  # voidgrid-bin:
