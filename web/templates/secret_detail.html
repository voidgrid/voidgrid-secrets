{{define "content"}}
<h1>{{.Secret.Name}}</h1>
<p class="muted">updated {{.Secret.UpdatedAt.Format "2006-01-02 15:04"}} UTC</p>

<h2>value</h2>
<p><code id="secret-value" class="secret-value">••••••••</code>
<button type="button" data-reveal-url="/secrets/{{.Secret.ID}}/value" data-target="secret-value">show</button></p>

<h2>change value</h2>
<form class="stack" method="post" action="/secrets/{{.Secret.ID}}/update">
    <label>new value
        <textarea name="value" rows="4" autocomplete="off" required></textarea>
    </label>
    <button type="submit">save</button>
</form>

<h2>rename</h2>
<form class="stack" method="post" action="/secrets/{{.Secret.ID}}/rename">
    <label>name
        <input type="text" name="name" value="{{.Secret.Name}}" required>
    </label>
    <button type="submit">rename</button>
</form>
<p class="muted">Tokens that use a name derived from this one (no explicit environment variable name) will see the new name.</p>

<h2>delete</h2>
<form method="post" action="/secrets/{{.Secret.ID}}/delete" data-confirm="Delete {{.Secret.Name}}? Every token grant on it goes too. This can't be undone.">
    <button type="submit">delete secret</button>
</form>
<div class="actions"><a href="/secrets">back to secrets</a></div>
{{end}}
