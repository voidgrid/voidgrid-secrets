{{define "content"}}
<h1>new secret</h1>
{{if .Created}}<p class="flash-info">created {{.Created}}</p>{{end}}
<form class="stack" method="post" action="/secrets/new">
    <label>name
        <input type="text" name="name" value="{{.Name}}" required autofocus>
    </label>
    <label>value
        <textarea name="value" rows="4" autocomplete="off" required></textarea>
    </label>
    {{if .Groups}}
    <fieldset>
        <legend>groups</legend>
        {{range .Groups}}
        <label><input type="checkbox" name="group" value="{{.ID}}"{{if index $.Ticked .ID}} checked{{end}}> {{.Name}}</label>
        {{end}}
    </fieldset>
    {{end}}
    {{if .Tokens}}
    <fieldset>
        <legend>grant access to tokens</legend>
        {{range .Tokens}}
        <label><input type="checkbox" name="token" value="{{.ID}}"{{if index $.TokenTicked .ID}} checked{{end}}> {{.Description}}</label>
        {{end}}
        <label>permission
            <select name="permission">
                <option value="read"{{if ne .Permission "write"}} selected{{end}}>read</option>
                <option value="write"{{if eq .Permission "write"}} selected{{end}}>write</option>
            </select>
        </label>
    </fieldset>
    {{end}}
    <label>new group (optional)
        <input type="text" name="new_group" value="{{.NewGroup}}" maxlength="64">
    </label>
    <button type="submit" name="action" value="save">save</button>
    <button type="submit" name="action" value="another">save and add another</button>
</form>
{{end}}
