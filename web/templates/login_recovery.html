{{define "content"}}
<h1>recovery code login</h1>
<p class="muted">Use one of your saved recovery codes. Each one works a single time.</p>
<form class="stack" method="post" action="/login/recovery">
    <label>username
        <input type="text" name="username" value="{{.Username}}" required autofocus>
    </label>
    <label>recovery code
        <input type="text" name="code" required>
    </label>
    <button type="submit">log in</button>
</form>
<p class="muted">— or <a href="/login">back to normal login</a> —</p>
{{end}}
