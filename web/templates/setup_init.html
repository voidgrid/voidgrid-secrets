{{define "content"}}
<h1>first-run setup</h1>
<p class="muted">Create this instance's one account. You'll enroll TOTP in the next step.</p>
<form class="stack" method="post" action="/setup">
    <label>setup token <span class="muted">(printed in the server log at startup)</span>
        <input type="password" name="setup_token" autocomplete="off" required autofocus>
    </label>
    <label>username
        <input type="text" name="username" required>
    </label>
    <label>password
        <input type="password" name="password" minlength="14" required>
    </label>
    <button type="submit">create account</button>
</form>
<p class="muted">— or <a href="/setup/oidc">configure OIDC</a> instead —</p>
{{end}}
