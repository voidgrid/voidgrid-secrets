{{define "content"}}
<h1>secrets</h1>
<div class="actions"><a href="/secrets/new">+ new secret</a></div>
{{if .Secrets}}
<table>
    <tr><th>name</th><th>owner</th><th>updated</th><th></th></tr>
    {{range .Secrets}}
    <tr>
        <td><a href="/secrets/{{.ID}}">{{.Name}}</a></td>
        <td>{{.OwnerType}} #{{.OwnerID}}</td>
        <td>{{.UpdatedAt.Format "2006-01-02 15:04"}}</td>
        <td><a href="/secrets/{{.ID}}/reveal">reveal</a></td>
    </tr>
    {{end}}
</table>
{{else}}
<p class="muted">no secrets yet</p>
{{end}}
{{end}}
