{{define "content"}}
<h1>{{.Group.Name}}</h1>
<p class="muted">{{.Group.Description}}</p>

<h2>members</h2>
<table>
    <tr><th>user</th><th>role</th><th></th></tr>
    {{range .Members}}
    <tr>
        <td>{{.Username}}</td>
        <td>{{.Role}}</td>
        <td>
            <form class="inline-form" method="post" action="/admin/groups/{{$.Group.ID}}/members/{{.UserID}}/delete">
                <button type="submit">remove</button>
            </form>
        </td>
    </tr>
    {{end}}
</table>

<h2>add member</h2>
<form class="stack" method="post" action="/admin/groups/{{.Group.ID}}/members">
    <label>user id
        <input type="number" name="user_id" required>
    </label>
    <label>role
        <select name="role">
            <option value="member">member</option>
            <option value="admin">admin</option>
        </select>
    </label>
    <button type="submit">add</button>
</form>
{{end}}
